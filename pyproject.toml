[project]
name = "flood-data-analysis"
version = "0.1.0"
description = "Modelo de previsão de cota de cheia no Vale do Taquari (RS) — projeto de pesquisa pessoal, NÃO é sistema de alerta"
requires-python = ">=3.12,<3.13"
dependencies = [
    "eccodes>=2.47.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "pdfplumber>=0.11.10",
    "pyarrow>=17",
    "pyyaml>=6.0",
    "tabulate>=0.10.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
geo = [
    "xarray>=2024.6",
    "cfgrib>=0.9.14",
    "rioxarray>=0.17",
    "geopandas>=1.0",
]
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
