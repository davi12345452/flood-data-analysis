[project]
name = "flood-data-analysis"
version = "1.0.0"
description = "Pipeline aberto de dados e previsão de cota do rio Taquari (RS) — pesquisa pessoal, NÃO é sistema de alerta"
license = { file = "LICENSE" }
authors = [{ name = "Davi Janisch Maia", email = "[e-mail removido do histórico]" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "eccodes>=2.47.0",
    "httpx>=0.27",
    "matplotlib>=3.11.1",
    "pandas>=2.2",
    "pdfplumber>=0.11.10",
    "pyarrow>=17",
    "pyyaml>=6.0",
    "tabulate>=0.10.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
geo = [
    "xarray>=2024.6",
    "cfgrib>=0.9.14",
    "rioxarray>=0.17",
    "geopandas>=1.0",
]
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    # Datas "hoje"/rótulos de arquivo são deliberadamente naïve: o projeto
    # localiza fusos numa única fronteira explícita (Fase 2) e usa a data
    # local para particionar downloads.
    "DTZ001", "DTZ007", "DTZ011",
    # Ingestão tolera falha por item de propósito (registra e segue) —
    # engolir silenciosamente seria o problema, e não é o caso: tudo loga.
    "BLE001",
    # pd.Timedelta é imutável; como default de argumento é seguro.
    "B008",
]
