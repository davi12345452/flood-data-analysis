[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flood-data-analysis"
version = "0.1.0"
description = "Flood frequency and trend analysis on real river gauge records from the USGS NWIS service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Davi Janis Chmaia" }]
keywords = ["hydrology", "floods", "data-analysis", "extreme-value", "usgs"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[project.scripts]
flood-analysis = "flood_analysis.cli:main"

[project.urls]
Homepage = "https://github.com/davi12345452/flood-data-analysis"
Issues = "https://github.com/davi12345452/flood-data-analysis/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/flood_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
