# Estações fluviométricas alvo — bacia Taquari-Antas (RS)
# Códigos confirmados em 2026-07-28 no inventário telemétrico da ANA
# (telemetriaws1.ana.gov.br/ServiceANA.asmx/ListaEstacoesTelemetricas).

estacoes_fluviometricas:
  - nome: Santa Tereza
    codigo: 86472600
    rio: Rio Taquari
    papel: montante
  - nome: Linha José Julio
    codigo: 86472000
    rio: Rio das Antas  # conforme boletim SACE; recebe a onda das UHEs CERAN
    papel: montante
    observacao: >
      idea.md dizia "sem cota de inundação", mas o boletim SACE de 2026-07-28
      declara inundação = 2450 cm (além de atenção 650 e alerta 1000).
      Premissa da Armadilha 7 possivelmente desatualizada — confirmar.
  - nome: Muçum
    codigo: 86510000
    rio: Rio Taquari
    papel: alvo principal (resposta mais rápida)
  - nome: Encantado
    codigo: 86720000
    rio: Rio Taquari
    papel: alvo principal
  - nome: Estrela
    codigo: 86879300
    rio: Rio Taquari
    papel: alvo — referência também para Lajeado e Cruzeiro do Sul
    observacao: >
      Não existe estação "Lajeado" no rio Taquari no inventário telemétrico da ANA.
      Proposta pendente de aprovação: cobrir Lajeado por esta estação.
      Lacunas severas no evento de 2024-05 (57% de cobertura em 01-03/05).
  - nome: Bom Retiro do Sul
    codigo: 86882000
    rio: Rio Taquari
    papel: intermediária (não alvo) — redundância entre Estrela e Taquari
    observacao: >
      Aparece nos boletins SACE mas o SOAP legado devolve 0 registros
      (2018-2026). Possivelmente operada por outra rede. Sem série utilizável
      por ora; reavaliar quando a credencial HidroWebService chegar.
  - nome: Porto Mariante
    codigo: 86895000
    rio: Rio Taquari
    papel: intermediária (não alvo) — redundância entre Estrela e Taquari
  - nome: Taquari
    codigo: 86950000
    rio: Rio Taquari
    papel: jusante (exutório)
    observacao: lacunas severas no evento de 2024-05 (46% de cobertura em 01-03/05)

usinas_ceran:
  # Fio d'água, sem regularização — defluência tratada como observação de montante.
  # Nomes conforme dataset dados_hidrologicos_ho do ONS (verificado em 2026-07-28).
  - nome_ons: MONTE CLARO
  - nome_ons: CASTRO ALVES
  - nome_ons: "14 DE JULHO"
    observacao: rompimento parcial em 2024-05-02 — dados do período são suspeitos

periodo:
  inicio: "2018-01-01"  # SOAP legado da ANA vazio antes de 2018; ONS horário desde 2019
  fim: hoje

horizontes_previsao_horas: [3, 6, 12, 24]
janelas_acumulado_chuva_horas: [1, 3, 6, 12, 24, 48, 72, 120]
timezone_alvo: America/Sao_Paulo  # conversão única e explícita a partir de UTC
